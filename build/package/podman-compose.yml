version: '3.8'

# Podman Compose configuration for TUF with go-tuf v2 (Production)
# Production-grade TUF implementation using official go-tuf v2 library

services:
  # TUF Repository and Server (go-tuf v2 - Production)
  tuf-server:
    build:
      context: ../../
      dockerfile: build/package/Dockerfile.tuf-server
    container_name: tuf-server
    ports:
      - "8080:8080"
    volumes:
      - tuf-repository:/app/tuf-repository-v2
      - tuf-config:/app/config
      - tuf-logs:/app/logs
    environment:
      - TUF_PORT=8080
      - TUF_HOST=0.0.0.0
      - TUF_REPOSITORY_PATH=/app/tuf-repository-v2
      - TUF_LOG_LEVEL=info
      - TUF_METRICS_ENABLED=true
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - tuf-network
    labels:
      - "com.example.service=tuf-server"
      - "com.example.version=2.0.0"

  # go-tuf v2 Client (Production)
  tuf-client:
    build:
      context: ../../
      dockerfile: build/package/Dockerfile.tuf-client
    container_name: tuf-client
    volumes:
      - tuf-repository:/app/tuf-repository-v2:ro
      - client-cache:/app/tuf-client-v2-cache
    depends_on:
      tuf-server:
        condition: service_healthy
    environment:
      - TUF_SERVER_URL=http://tuf-server:8080
      - TUF_CACHE_DIR=/app/tuf-client-v2-cache
      - TUF_REPOSITORY_PATH=/app/tuf-repository-v2
    command: ["--server", "http://tuf-server:8080", "--cache", "/app/tuf-client-v2-cache", "--repo", "/app/tuf-repository-v2"]
    networks:
      - tuf-network

volumes:
  tuf-repository:
    driver: local
  tuf-config:
    driver: local
  tuf-logs:
    driver: local
  client-cache:
    driver: local

networks:
  tuf-network:
    driver: bridge