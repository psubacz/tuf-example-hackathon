version: '3.8'

# Production Podman Compose configuration for Enhanced TUF Server v2.0
# Includes security hardening, monitoring, SSL termination, and high availability

services:
  # TUF Repository Initialization (runs once)
  tuf-init:
    build:
      context: ../../
      dockerfile: build/package/Dockerfile.tuf-demo
    container_name: tuf-init-prod
    volumes:
      - tuf-repository:/app/tuf-repository
    restart: "no"
    networks:
      - tuf-internal

  # Add targets after initialization
  add-targets:
    build:
      context: ../../
      dockerfile: build/package/Dockerfile.add-targets
    container_name: tuf-add-targets-prod
    volumes:
      - tuf-repository:/app/tuf-repository
    depends_on:
      - tuf-init
    restart: "no"
    networks:
      - tuf-internal

  # Enhanced TUF Repository Server - Production Configuration
  tuf-server:
    build:
      context: ../../
      dockerfile: build/package/Dockerfile.tuf-server
    container_name: tuf-server-prod
    expose:
      - "8080"  # Internal port only, external access through nginx
      - "8443"  # HTTPS for direct access if needed
    volumes:
      - tuf-repository:/app/tuf-repository:ro
      - tuf-config:/app/config:ro
      - tuf-logs:/app/logs
    depends_on:
      - tuf-init
      - add-targets
    environment:
      # Core server settings
      - TUF_PORT=8080
      - TUF_HOST=0.0.0.0
      - TUF_REPOSITORY_PATH=/app/tuf-repository
      - TUF_LOG_LEVEL=warn
      - TUF_LOG_FORMAT=json
      
      # Security settings
      - TUF_CORS_ENABLED=false  # Disabled in production
      - TUF_RATE_LIMIT_ENABLED=true
      - TUF_RATE_LIMIT_REQUESTS=10000  # Higher limit for production
      
      # Performance optimization
      - TUF_COMPRESSION_ENABLED=true
      - TUF_COMPRESSION_LEVEL=6  # Balanced compression
      - TUF_CACHE_ENABLED=true
      - TUF_CACHE_TTL=15m
      
      # Monitoring
      - TUF_METRICS_ENABLED=true
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - tuf-internal
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m

  # NGINX Reverse Proxy with SSL Termination
  nginx:
    image: nginx:1.25-alpine
    container_name: tuf-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx-tuf.conf:/etc/nginx/conf.d/tuf.conf:ro
      - tuf-ssl:/etc/nginx/ssl:ro
      - tuf-logs:/var/log/nginx
    depends_on:
      tuf-server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - tuf-public
      - tuf-internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE

  # Prometheus for Metrics Collection
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: tuf-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--log.level=warn'
    depends_on:
      - tuf-server
    restart: unless-stopped
    networks:
      - tuf-internal
    security_opt:
      - no-new-privileges:true
    user: "65534:65534"

  # Grafana for Visualization
  grafana:
    image: grafana/grafana:10.1.0
    container_name: tuf-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana-provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin123}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SECURITY_DISABLE_GRAVATAR=true
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - tuf-internal
    security_opt:
      - no-new-privileges:true
    user: "472:472"

  # Health Check Service
  healthcheck:
    image: curlimages/curl:8.3.0
    container_name: tuf-healthcheck
    depends_on:
      - nginx
    command: |
      sh -c '
        while true; do
          echo "Health check at $$(date)"
          curl -f http://nginx/health || echo "Health check failed"
          sleep 60
        done
      '
    restart: unless-stopped
    networks:
      - tuf-internal

volumes:
  tuf-repository:
    driver: local
  tuf-config:
    driver: local
  tuf-logs:
    driver: local
  tuf-ssl:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  tuf-public:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
  tuf-internal:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.21.0.0/24