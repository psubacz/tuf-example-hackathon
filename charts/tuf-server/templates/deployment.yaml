apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tuf-server.fullname" . }}
  labels:
    {{- include "tuf-server.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "tuf-server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "tuf-server.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "tuf-server.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.config.initRepository }}
      initContainers:
        - name: init-tuf-repo
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["./tuf-server"]
          args: ["--init", "--repo", "/shared"]
          env:
            - name: TUF_REPOSITORY_PATH
              value: "{{ .Values.config.repositoryPath }}"
          volumeMounts:
            - name: shared-repository
              mountPath: /shared
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["./tuf-server"]
          args: ["--init", "--port", "{{ .Values.config.port }}", "--repo", "/shared"]
          ports:
            - name: http
              containerPort: {{ .Values.config.port }}
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            - name: TUF_PORT
              value: {{ .Values.config.port | quote }}
            - name: TUF_REPOSITORY_PATH
              value: "{{ .Values.config.repositoryPath }}"
            - name: TUF_LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: TUF_CORS_ENABLED
              value: {{ .Values.config.cors.enabled | quote }}
            - name: TUF_TLS_ENABLED
              value: {{ .Values.config.tls.enabled | quote }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: shared-repository
              mountPath: /shared
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: shared-repository
          emptyDir: {}
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}